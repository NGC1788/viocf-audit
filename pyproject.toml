[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viocf-audit"
version = "0.1.0"
description = "Real-instrument counterfactual audit for controllable violin generators"
readme = "README_KO.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
  "lightgbm>=4.0",
  "joblib>=1.3,<2",
  "librosa>=0.10.2,<0.12",
  "matplotlib>=3.8,<4",
  "mido>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "seaborn>=0.13,<1",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
f0 = ["swift-f0==0.1.2"]

[project.scripts]
viocf = "viocf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
